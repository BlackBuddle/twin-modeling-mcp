/* twin-modeling-mcp의 공개 3D 화면 (reusable-parts 3.1e, 설계 47, 시안 B). 영어와 한국어. 모양은 plc-mcp의 3D 탭과 같다(TW193):

:root {

  --sk-clear: #a9cfdc; --sk-clear-op: 0.3; --sk-mark: #ffb020;
  --sk-line: #3d3d43; --sk-line-inv: #b9bcc3; --sk-line-clear: #5f8391; --sk-line-mark: #8a5a00;
  --sk-lamp-off: #4a4c52; --sk-belt-mark: #7d8088;
  /* 말마다 글꼴 한 벌 (TW206): 영어는 시스템 글꼴, 한국어는 맑은 고딕 계열. 웹 글꼴 없음 */
  --font: system-ui, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;

}
:root:lang(ko) { --font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; --serif: "Noto Serif KR", "Batang", "바탕", Georgia, serif; }
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

.strip { position: absolute; left: 0; top: 0; display: flex; flex-wrap: wrap; gap: 2px 8px; max-width: calc(100vw - 16px); padding: 2px 7px; background: rgba(251, 251, 250, 0.94); border: 1px solid var(--a-faint); border-radius: 4px; font: 600 12px/17px var(--mono); color: var(--ink); white-space: nowrap; }

.strip.two { max-width: 330px; white-space: normal; }
.atag { position: absolute; left: 0; top: 0; padding: 1px 7px; background: var(--panel); border: 1.5px solid var(--bad); border-radius: 4px; color: var(--bad); font: 700 12px/17px var(--font); white-space: nowrap; }
.brk { position: absolute; left: 0; top: 0; pointer-events: none; --c: var(--ink); --t: 2px; --l: 14px; filter: drop-shadow(0 0 1px var(--a-paper)) drop-shadow(0 0 1px var(--a-paper));
  background:
    linear-gradient(var(--c), var(--c)) left top / var(--l) var(--t), linear-gradient(var(--c), var(--c)) left top / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) right top / var(--l) var(--t), linear-gradient(var(--c), var(--c)) right top / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) left bottom / var(--l) var(--t), linear-gradient(var(--c), var(--c)) left bottom / var(--t) var(--l),

.sel { min-height: 40px; max-width: 240px; padding: 0 8px; border: 1px solid var(--muted); border-radius: 6px; background: var(--panel); font-size: 13px; }

/* 위 줄: 이름, 모델 고르기, 초안 표시, 말 바꾸기, 메뉴. 어느 너비에서도 한 줄이다 */
.top { position: absolute; z-index: 5; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }

.end { margin-left: auto; display: flex; gap: 8px; }
.bar { position: absolute; z-index: 5; top: 64px; left: 12px; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px; border: 1px solid var(--ink); border-radius: 6px; background: var(--panel); font-size: 13px; font-weight: 700; }
/* 아래 막대: 어떻게 도는지 */
.dock { position: absolute; z-index: 5; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(760px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--muted); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.1); padding: 8px 10px; display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 8px; align-items: center; }

.line .fill { position: absolute; left: 0; height: 4px; background: var(--ink); border-radius: 2px; }
.time { font: 600 12px/1 var(--mono); white-space: nowrap; }

#speedRow { display: none; align-items: center; gap: 8px; }
/* 카드: 고른 장치 하나 */
.card { position: absolute; z-index: 4; right: 12px; top: 68px; width: 320px; max-height: calc(100% - 200px); overflow: auto; background: var(--panel); border: 1px solid var(--muted); border-radius: 6px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1); padding: 12px 14px; }

.card .x { width: 32px; height: 32px; border: 0; background: transparent; font-size: 20px; cursor: pointer; }

.card .stt { margin: 2px 0 8px; font-weight: 700; }

.pin.on .lp { background: var(--k); }

.menu .in .dev { font: 700 13px/1.3 var(--font); margin: 6px 0 0; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dl { list-style: none; margin: 0; padding: 0; display: grid; }

.dl > li:first-child { border-top: 0; }
.dl .nm { flex: 1; min-height: 40px; border: 0; background: none; padding: 0; text-align: left; font-weight: 700; cursor: pointer; overflow-wrap: anywhere; }
.dl .nm.plain { cursor: default; font-weight: 600; }

  if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = t('skin.checkall.arm'); skArm = setTimeout(() => { b.dataset.arm = ''; b.textContent = t('skin.checkall'); }, 4000); return; }
  clearTimeout(skArm); b.dataset.arm = ''; b.textContent = t('skin.checkall'); skinCheck(unchecked().map(d => d.id), true);
};
$('skinChip').onclick = () => openMenu(true, 'dDev');
function buildDraft() {
  const d = data && data.diff, box = $('diff'), items = [];
  if (d) {
    const old = id => ((data.scene && data.scene.devices) || []).find(x => x.id === id) || {}, nu = id => (data.draft.devices || []).find(x => x.id === id) || {};
    const li = (cls, k, title, extra) => { const e = el('li', cls), b = el('div'); b.append(el('b', '', title)); if (extra) b.append(el('span', 'f', extra)); e.append(el('span', 'k', k), b); return e; };
    for (const id of d.added) items.push(li('add', t('draft.added'), labelOf(nu(id)) + ' · ' + (TEXT['kind.' + nu(id).kind] ? t('kind.' + nu(id).kind) : nu(id).kind)));
    for (const c of d.changed) items.push(li('chg', t('draft.changed'), labelOf(nu(c.id)), c.fields.join(', ')));
    for (const id of d.removed) items.push(li('del', t('draft.removed'), labelOf(old(id)) || id));
  }
  $('drN').textContent = data && data.draft ? t('draft.changes', { n: items.length }) : '';
  const ul = el('ul', 'diff'); ul.append(...items);
  box.replaceChildren(el('p', 'note', t(data && data.draft ? 'draft.shown' : 'draft.none')), ul);
  $('draftActs').hidden = !(data && data.draft); disarm();
  if (data && data.scene_error && !data.draft) box.append(el('p', 'note bad', data.scene_error));
  if (data && data.draft_error) box.append(el('p', 'note bad', data.draft_error));
}
const sw = (id, fn) => { const b = $(id); b.onclick = () => { const v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', String(v)); b.querySelector('.w').textContent = t(v ? 'sw.on' : 'sw.off'); fn(v, v2 => { b.setAttribute('aria-checked', String(v2)); b.querySelector('.w').textContent = t(v2 ? 'sw.on' : 'sw.off'); }); }; return b; };
sw('swAuto', async (v, set) => { const r = await api('POST', '/api/twin/auto', { on: v }); if (!r.ok) { set(!v); say(serverText(r), true); } });
sw('swStrips', v => twin.strips(v)); sw('swFlow', v => twin.flow(v)); sw('swCut', v => twin.cut(v));
async function loadAuto() { const r = await api('GET', '/api/twin/auto'); if (r.ok) { $('swAuto').setAttribute('aria-checked', String(!!r.v.on)); $('swAuto').querySelector('.w').textContent = t(r.v.on ? 'sw.on' : 'sw.off'); } }
$('confirm').onclick = async () => { const r = await api('POST', '/api/twin/confirm', { scene: sceneName }); if (!r.ok) return void ($('edMsg').textContent = serverText(r)); $('edMsg').textContent = ''; say(t('draft.confirmed')); await loadScene(false); };
function disarm() { clearTimeout(armT); $('discard').textContent = t('draft.discard'); $('discard').dataset.arm = ''; }
$('discard').onclick = async () => { // 버리기는 두 번 눌러야 한다 (되돌릴 수 없음)
  if (!$('discard').dataset.arm) { $('discard').dataset.arm = '1'; $('discard').textContent = t('draft.discard.arm'); armT = setTimeout(disarm, 4000); return; }
  const r = await api('DELETE', '/api/twin/draft?scene=' + enc(sceneName)); if (!r.ok) return void ($('edMsg').textContent = serverText(r));
  say(t('draft.discarded')); await loadScene(false);
};
$('draftChip').onclick = () => openMenu(true, 'dDraft');
// 공작물: 그림에는 보이고, 조작은 "부품 처음으로" 하나뿐이다 (TW201)
function buildParts() {
  const has = !!(twin.work.types && twin.work.types()), sec = $('dParts'); $('partsNote').textContent = t(has ? 'parts.line' : 'parts.none'); $('partsReset').disabled = !has || !simId; sec.hidden = false;
}
$('partsReset').onclick = async () => { if (!simId) return; const r = await api('POST', '/api/ladder/sim/part', { sim: simId, reset: true }); if (!r.ok) return say(serverText(r), true); accept(r.v); };
// 고장 넣기 (F25): 장치마다 하나. 시뮬을 처음부터 다시 돌린다
const FAULTS = ['sensor_stuck_on', 'sensor_stuck_off', 'coil_dead', 'air_off', 'slow'];
const faultCan = d => { const K = kindOf(d), B = K.behaviors || []; return K.simulated !== false && (B.includes('linear') || B.includes('rotary') || B.includes('belt')); };
function buildFaults() {
  for (const id in faults) if (!devOf(id)) delete faults[id];
  const opt = (v, s) => { const o = el('option', '', s); o.value = v; return o; };
  const devs = (shown ? shown.devices : []).filter(faultCan);
  $('fList').replaceChildren(...(devs.length ? devs.map(dev => {
    const bits = pinsOf(dev).filter(p => !p.word), f = faults[dev.id] || {}, li = el('li'), kind = el('select'), addr = el('select'), fac = el('input'), name = labelOf(dev);
    kind.setAttribute('aria-label', name); addr.setAttribute('aria-label', name + ' · ' + t('faults.all_sensors')); fac.setAttribute('aria-label', t('faults.factor'));
    kind.append(opt('', t('faults.none')), ...FAULTS.map(v => opt(v, t('faults.' + v)))); kind.value = f.fault || '';
    Object.assign(fac, { type: 'number', min: 1, max: 10, step: 0.5, value: f.factor || 2 });
    const fill = () => { const k = kind.value, list = k.startsWith('sensor') ? bits.filter(p => !p.out) : k === 'coil_dead' ? bits.filter(p => p.out) : []; addr.replaceChildren(opt('', t(k === 'coil_dead' ? 'faults.all_coils' : 'faults.all_sensors')), ...list.map(p => opt(p.pin, p.pin))); addr.hidden = !list.length; fac.hidden = k !== 'slow'; };
    const set = () => { if (!kind.value) delete faults[dev.id]; else faults[dev.id] = { fault: kind.value, addr: addr.hidden ? '' : addr.value, factor: Math.min(10, Math.max(1, Number(fac.value) || 2)) }; faultApply(); };
    fill(); addr.value = f.addr || ''; kind.onchange = () => { fill(); set(); }; addr.onchange = set; fac.onchange = set;
    li.append(el('span', 'nm plain', name), kind, addr, fac); return li;
  }) : [el('li', '', t('faults.nodev'))]));
  const n = Object.keys(faults).length; $('fN').textContent = n ? String(n) : ''; $('fClear').disabled = !n;
}
async function faultApply() { const n = Object.keys(faults).length; $('fN').textContent = n ? String(n) : ''; $('fClear').disabled = !n; if (simId) { const ok = await simStart(!playing); $('fMsg').textContent = ok ? t('faults.restarted') : ''; } } // 다시 시작에 실패했으면 "다시 시작했습니다"라고 하지 않는다 (R3-24)
$('fClear').onclick = () => { faults = dict(); buildFaults(); faultApply(); };
$('fit').onclick = () => { applyInset(); twin.fit(); };
function openMenu(on, section) {
  $('menu').hidden = !on; $('menuBtn').setAttribute('aria-expanded', String(on));
  if (on && section) { for (const d of document.querySelectorAll('#menu details')) d.open = d.id === section; }
  if (on) { buildPins(true); $('menuClose').focus(); } else $('menuBtn').focus();
  applyInset();
}
$('menuBtn').onclick = () => openMenu($('menu').hidden); $('menuClose').onclick = () => openMenu(false);
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('menu').hidden) openMenu(false); else if (sel) pick(null); } });
// 그림 위에 얹은 것(오른쪽 카드, 아래 막대)을 뺀 칸에 맞춘다 (F1, TW208): 카드는 900 px 이상에서만 옆에 선다
function applyInset() {
  const open = !$('card').hidden, side = open && innerWidth >= 900, menu = !$('menu').hidden ? $('menu').offsetWidth : 0;
  // 폰: 카드가 막대 위에 서므로 그림은 카드 위의 띠에 맞춘다
  const floor = Math.min($('dock').getBoundingClientRect().top, open && !side ? $('card').getBoundingClientRect().top : Infinity);
  twin.setInset({ right: Math.max(side ? $('card').offsetWidth + 24 : 0, menu), bottom: Math.max(0, innerHeight - floor) });
}
addEventListener('resize', () => { paintTexts(); applyInset(); });

function buildAll() { buildPins(true); buildSheet(); buildDevices(); buildDraft(); buildParts(); buildFaults(); buildCard(); paintDock(); }
function paintAll() { paintDock(); paintCard(); buildPins(); buildParts(); }

// ---- AI에게 줄 그림 (model_render): 보이는 동안 1초마다 요청이 있는지 묻고, 있으면 요청의 시점으로 그려 JPEG와 장치 상자를 보낸다 ----
let rPoll = false; // 묻는 고리는 하나만 돈다 (R3-24)
async function renderPoll() {
  clearTimeout(rT); if (!active || halted || rPoll) return;
  rPoll = true;
  try {
    if (!rBusy) { const r = await api('GET', '/api/twin/render/next'); if (!r.ok && r.status === 403) return; if (r.ok && r.v.request) { rBusy = true; try { await renderAnswer(r.v.request); } finally { rBusy = false; } } }
  } finally { rPoll = false; }
  clearTimeout(rT); if (active && !halted) rT = setTimeout(renderPoll, 1000);
}
async function renderAnswer(q) {
  if (!shown || q.scene !== sceneName) return renderFail(api, q, `the page shows model ${sceneName || '(none)'}, not ${q.scene}`);
  try { await renderShot(api, twin, q, 16 / 9); } catch (e) { renderFail(api, q, (e && e.message) || 'render failed'); }
}

// ---- 시작 ----
(async function () {
  paintTexts();
  if (TOKEN.startsWith('__')) return empty(t('empty.notoken'), '');
  const c = await api('GET', '/api/twin/catalog');
  if (!c.ok) return empty(c.status === 403 ? t('net.forbidden') : t('net.down'), '');
  cat = c.v; await loadModels(); loadAuto(); paintTexts();
  renderPoll();
})();
</script>
